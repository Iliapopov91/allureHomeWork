name: Test

on: [push]

jobs:
  test:
    # где запускаем
    runs-on: ubuntu-laters
    # что делаем
    steps:
      # выкачиваем репозиторий
      - uses: actions/checkout@v3
      # настраиваем java
      - uses: actions/setup-java@v3
        with:
            distribution: 'zulu'
            java-version: '17'
      # запуск тестов
      - run: ./gradlew clean test