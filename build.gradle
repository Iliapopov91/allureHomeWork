plugins {
    id 'java'
    id 'io.qameta.allure' version '3.2.0'
}

repositories {
    mavenCentral()
}
allure {
    report {
        version.set("2.27.0")
    }
        adapter {
            aspectjWeaver.set(true) //обработка аннотации @Step
            frameworks {
                junit5 {
                    adapterVersion.set("2.27.0")
                }
            }
        }
    }


dependencies {
    testImplementation(
    "com.codeborne:selenide:7.14.0",
    "org.junit.jupiter:junit-jupiter:5.10.0",
    "org.slf4j:slf4j-simple:2.0.13",
    'com.github.javafaker:javafaker:1.0.2',
    "io.qameta.allure:allure-selenide:2.35.2",
    'org.junit.platform:junit-platform-launcher'

    )
}

test {
    useJUnitPlatform()
}